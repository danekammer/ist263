    <main>

      <div class="row row1">
        <div class="col box">
          <p>Dane Kammer</p>

        <div class="col box">

        </div>

      <div class="row row2">
        <div class="col box">
          <h2>Contact Form</h2>

          <form action="https://formspree.io/f/xqpakzlb" method="post">

            <div class="form-field">
              <label for="name">Your Name:</label>
              <input type="text" id="name" name="name">
            </div>

            <div class="form-field">
              <label for="reason">Reason for contacting:</label>
              <select id="reason" name="reason">
                <option value="general">General Inquiry</option>
                <option value="job">Job Opportunity</option>
                <option value="feedback">Feedback</option>
              </select>
            </div>

            <div class="form-field">
              <label for="message">Message:</label>
              <textarea id="message" name="message" rows="4"></textarea>
            </div>

            <input type="submit" value="Submit">

          </form>
        </div>

        <div class="col box">
          <iframe title="Map of 146 Randlett Park, West Newton, MA" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3174.9122510992493!2d-71.22549372381073!3d42.355164235410825!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89e382ee976baf4f%3A0x8b02ebf351307358!2s146%20Randlett%20Park%2C%20West%20Newton%2C%20MA%2002465!5e1!3m2!1sen!2sus!4v1788986675191!5m2!1sen!2sus" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
