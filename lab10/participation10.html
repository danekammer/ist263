<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Participation 10</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      background: #ffffff;
      color: #1f3a4d;
    }

    /* Hide both messages by default */
    .large, .small { display: none; }

    /* Viewport over 800px: show "I'm large." */
    @media (min-width: 801px) {
      .large { display: block; font-size: 6rem; }
    }

    /* Viewport 800px or less: show "I'm small." */
    @media (max-width: 800px) {
      .small { display: block; font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <p class="large">I’m large.</p>
  <p class="small">I’m small.</p>
</body>
</html>
